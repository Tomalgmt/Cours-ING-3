# =====================================================================
#  preseed.cfg — installation automatique de la VM du TP1
#  Durcissement Linux et Windows — Debian 12 (bookworm), amd64 et arm64
#
#  Resultat : Debian 12 + bureau leger Xfce + terminal + serveur SSH,
#  compte "etudiant" (sudo), baseline degradee deja appliquee, scripts
#  du TP deposes dans /home/etudiant/tp.
#
#  AVANT DIFFUSION : remplacer l'URL ci-dessous (une seule occurrence,
#  dans late_command) par l'emplacement ou vous publiez postinstall.sh,
#  degrade-debian.sh et check-debian.sh (Moodle, GitHub raw, ou un
#  simple "python3 -m http.server" sur le poste enseignant).
# =====================================================================

### Langue, pays, clavier
d-i debian-installer/locale string fr_FR.UTF-8
d-i localechooser/supported-locales multiselect fr_FR.UTF-8, en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select fr(latin9)
d-i console-setup/ask_detect boolean false

### Reseau
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string debian12
d-i netcfg/get_domain string lab.local
d-i netcfg/hostname string debian12
d-i hw-detect/load_firmware boolean true

### Miroir
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

### Horloge
d-i clock-setup/utc boolean true
d-i time/zone string Europe/Paris
d-i clock-setup/ntp boolean true

### Comptes
# Compte root desactive : l'etudiant passe par sudo, comme dans le sujet.
d-i passwd/root-login boolean false
d-i passwd/user-fullname string Etudiant TP
d-i passwd/username string etudiant
d-i passwd/user-password password tp-durcissement
d-i passwd/user-password-again password tp-durcissement
d-i user-setup/allow-password-weak boolean true
d-i user-setup/encrypt-home boolean false

### Partitionnement : disque entier, une seule partition (comme le sujet)
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman/default_filesystem string ext4
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

### Paquets
tasksel tasksel/first multiselect standard, ssh-server, xfce-desktop
d-i pkgsel/include string sudo openssh-server xfce4-terminal firefox-esr mousepad \
    curl wget git nano vim less htop ca-certificates
d-i pkgsel/upgrade select safe-upgrade
popularity-contest popularity-contest/participate boolean false

### Amorçage
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
d-i grub-installer/bootdev string default

### Fin d'installation sans question
d-i finish-install/reboot_in_progress note

### Post-installation
# Recupere et execute postinstall.sh : bureau, autologin, degradation,
# depot des scripts du TP. En cas d'echec reseau, l'installation reste
# valide : l'etudiant lance preparer-vm.sh a la main (cf. README).
d-i preseed/late_command string \
    in-target sh -c 'URL=https://REMPLACER-PAR-VOTRE-URL/kit-vm; \
      (wget -qO /root/postinstall.sh "$URL/postinstall.sh" || curl -fsSL -o /root/postinstall.sh "$URL/postinstall.sh") \
      && chmod +x /root/postinstall.sh && POSTINSTALL_URL="$URL" /root/postinstall.sh >/root/postinstall.log 2>&1 \
      || echo "postinstall non applique - lancer preparer-vm.sh a la main" > /root/POSTINSTALL-A-FAIRE.txt'
