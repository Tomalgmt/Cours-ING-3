name: Actualiser le README

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: readme-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Récupérer la version actuelle de la branche
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Vérifier le générateur
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v

      - name: Recalculer le README et les visuels
        run: python3 .github/scripts/update_readme.py

      - name: Enregistrer uniquement les fichiers générés
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add -- README.md .github/assets/banner.svg .github/assets/dashboard.svg
          if git diff --cached --quiet; then
            echo "Le README est déjà à jour."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: actualise le tableau de bord des cours'
          # A normal push cannot overwrite a concurrent user commit.
          # A new push to the default branch queues a fresh calculation.
          git push origin "HEAD:$DEFAULT_BRANCH"
